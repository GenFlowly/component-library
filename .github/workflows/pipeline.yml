name: Pipeline

# Release on every push to main (direct pushes and merged PRs alike):
# bump the patch version, build, test, push the bump commit, publish.
# Uses only the built-in GITHUB_TOKEN — contents:write pushes the bump
# (main is unprotected), packages:write publishes to GitHub Packages.
on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    # Safety net against self-triggering (GITHUB_TOKEN pushes don't retrigger
    # workflows, but keep the guard in case that ever changes)
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    env:
      CI: true
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com/
          scope: '@genflowly'

      - run: npm ci

      - name: Increment package version
        run: |
          git config user.email "bot@genflowly.com"
          git config user.name "genflowly-bot"
          npm version patch --no-git-tag-version
          git add package.json package-lock.json
          git commit -m "chore: bump version to $(node -p "require('./package.json').version") [skip ci]"

      - name: Build
        run: npm run release

      - name: Test
        run: npm test

      - name: Push version bump
        run: git push

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
