name: Pipeline

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  version-bump:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0 # Important for version tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm install

      - name: Increment package version
        run: |
          git config --global user.email "bot@genflowly.com"
          git config --global user.name "genflowly-bot"
          npm version patch --no-git-tag-version
          git add package-lock.json
          git add package.json
          git commit -m "chore: bump version update package-lock.json" || echo "No changes to commit"
          git push --follow-tags

  build:
    needs: version-bump
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all tags and branches
      - name: Fetch latest changes
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git checkout main
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm ci
      - run: npm run release
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ./dist
            ./package.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ needs.build.result == 'success' }}
    env:
      CI: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.1.7
        with:
          name: build-artifacts
          path: ./dist
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: https://npm.pkg.github.com/
          scope: '@genflowly'
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
